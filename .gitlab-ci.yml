# CI for AdversaryForge — lint + the full test suite (which INCLUDES the /contracts
# producer/consumer contract tests and the regression-scan SLO timing test) plus a
# fully-offline CLI smoke, on every push and merge request. This is the "verify in CI"
# the spec calls for (Week-3 § engineering requirements).
stages:
  - test

test:
  stage: test
  image: python:3.12-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .uv-cache/
  before_script:
    # Install from the pinned uv.lock (--locked fails on lockfile drift), so GitLab CI
    # runs the EXACT dependency set rather than a bare, unpinned `pip install -e`.
    - pip install uv
    - uv sync --extra dev --locked
  script:
    - uv run ruff check adversaryforge tests
    - uv run pytest -q
    # Offline CLI smoke — no target, no secrets; proves the CLI wiring end-to-end.
    - uv run python -m adversaryforge.cli seed-demo
    - uv run python -m adversaryforge.cli status
    - uv run python -m adversaryforge.cli report
