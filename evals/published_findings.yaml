# AdversaryForge — PUBLISHED FINDINGS LEDGER (machine-readable, committed)
#
# The confirmed, real exploits behind reports/VULN-*.md. Two jobs:
#   1. PROVENANCE + REPRODUCIBILITY — `adversaryforge seed-published` loads these into a
#      fresh clone's store so status/regress/report work and the reports regenerate
#      byte-for-byte (their source no longer lives only in the git-ignored SQLite DB).
#   2. REMEDIATION CONTRACT — each finding carries `remediation.{affected_endpoint,
#      target_code_hint, recommended_fix}` so the NEXT step (an agent that reads a finding
#      and fixes the target app in ../openemr-base-clean) has a machine-readable target.
# `exploit` is the verbatim ConfirmedExploit contract; `steps` replays the attack.

