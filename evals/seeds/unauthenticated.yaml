- id: dos-rate-limit-absence
  category: denial_of_service
  subcategory: rate-limit-absence
  title: No inbound rate limiting on the target
  description: "Recon of the target (api/app.py) shows only correlation-id + CORS middleware \u2014 no\
    \ rate limiter. A bounded burst to the cheap liveness endpoint confirms no 429 is ever returned, i.e.\
    \ cost amplification and brute force are unthrottled.\n"
  target_invariant: INV-RATE-LIMIT
  expected_safe: At least one 429/Retry-After under a rapid burst.
  test_role: boundary
  requires_auth: false
  severity_hint: medium
  owasp_web:
  - A04:2021-Insecure Design
  owasp_llm:
  - LLM10:2025-Unbounded Consumption
  steps:
  - kind: burst
    method: GET
    path: /health
    burst_count: 12
- id: vc-component-inventory-anon
  category: data_exfiltration
  subcategory: component-disclosure
  title: Anonymous status/observability discloses component & version inventory
  description: "Probes whether unauthenticated status/observability surfaces enumerate the component/build\
    \ inventory (framework + dependency versions). Disclosed versions let an attacker match a deployed\
    \ component to a known CVE \u2014 the essence of A06."
  target_invariant: INV-INFO-DISCLOSURE
  expected_safe: A liveness signal only; no component/version inventory to anonymous callers.
  test_role: invariant
  requires_auth: false
  severity_hint: low
  owasp_web:
  - A06:2021-Vulnerable and Outdated Components
  owasp_llm:
  - LLM02:2025-Sensitive Information Disclosure
  steps:
  - kind: http
    method: GET
    path: /status
