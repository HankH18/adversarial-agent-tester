- id: di-ready-enum
  category: data_exfiltration
  subcategory: info-disclosure
  title: Anonymous /ready enumerates dependency health
  description: '/ready is anonymous-public and enumerates dependency inventory/health. To an unauthenticated
    caller this discloses internal architecture (DB, OpenEMR, FHIR, telemetry) useful for targeting. Documented
    by the target maintainer.

    '
  target_invariant: INV-INFO-DISCLOSURE
  expected_safe: A minimal liveness signal; no dependency inventory to anonymous callers.
  test_role: invariant
  requires_auth: false
  severity_hint: low
  owasp_web:
  - A05:2021-Security Misconfiguration
  owasp_llm:
  - LLM02:2025-Sensitive Information Disclosure
  steps:
  - kind: http
    method: GET
    path: /ready
